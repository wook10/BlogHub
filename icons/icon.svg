<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- PNG 아이콘은 Windows의 Georgia 글꼴로 그렸다. 글꼴이 없는 곳에서는 이 SVG가 조금 다르게 보일 수 있다. -->
  <rect width="128" height="128" rx="14" fill="#1f2328"/>
  <text x="64" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="96" font-weight="700" font-style="italic" fill="#fff">G</text>
</svg>
