<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- PNG는 npm run icons 로 다시 만든다 -->
  <rect width="128" height="128" rx="14" fill="#1f2328"/>
  <defs>
    <!-- 둥근 획: 오른쪽으로 치우친 안쪽 타원을 빼서 왼쪽은 굵고 위아래는 얇게, 오른쪽 위는 비워 G의 입을 만든다 -->
    <mask id="veloghub-g-stroke">
      <rect width="128" height="128" fill="#fff"/>
      <ellipse cx="70" cy="64" rx="23" ry="31" fill="#000"/>
      <path d="M68 61 L128 61 L128 14 Z" fill="#000"/>
    </mask>
    <!-- 가로 막대와 턱이 둥근 획 밖으로 삐져나오지 않게 바깥 타원으로 자른다 -->
    <clipPath id="veloghub-g-outer">
      <ellipse cx="64" cy="64" rx="38" ry="42"/>
    </clipPath>
  </defs>
  <g transform="translate(14 0) skewX(-12)" fill="#fff">
    <ellipse cx="64" cy="64" rx="38" ry="42" mask="url(#veloghub-g-stroke)"/>
    <path d="M66 61 H110 V110 H91 V71 H66 Z" clip-path="url(#veloghub-g-outer)"/>
  </g>
</svg>
