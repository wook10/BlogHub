<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="14" fill="#1f2328"/>
  <defs>
    <!-- G의 오른쪽 위를 비워 입을 만든다 -->
    <mask id="open"><rect width="128" height="128" fill="#fff"/><path d="M68 61 L128 61 L128 14 Z" fill="#000"/></mask>
  </defs>
  <g transform="translate(14 0) skewX(-12)" fill="#fff">
    <!-- 바깥 타원에서 오른쪽으로 치우친 안쪽 타원을 빼서 왼쪽은 굵고 위아래는 얇은 획 -->
    <path mask="url(#open)" fill-rule="evenodd" d="M64 22a38 42 0 1 0 0.1 0Z M70 33a23 31 0 1 0 0.1 0Z"/>
    <!-- 가로 막대와, 둥근 획 안쪽으로 내려오는 턱 -->
    <path d="M66 61 H102 V71 H101 V92 H91 V71 H66 Z"/>
  </g>
</svg>
